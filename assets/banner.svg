<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="greenPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="purplePill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes barGrow {
        0%, 100% { height: 35px; }
        50% { height: 65px; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }

      .floating-pill-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-pill-2 { animation: floatFast 7.5s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow 8s ease-in-out infinite 1s; }
      .glow-orb { animation: pulseGlow 5s ease-in-out infinite alternate; }
      .flow-line { stroke-dasharray: 8 6; animation: dashMove 3s linear infinite; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
      .text-badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Decorative Grid Pattern -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.18">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1150" y1="0" x2="1150" y2="360"/>
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="200" cy="90" r="110" fill="#38bdf8" opacity="0.18" filter="url(#glow)" class="glow-orb"/>
  <circle cx="1020" cy="180" r="140" fill="#818cf8" opacity="0.16" filter="url(#glow)" class="glow-orb"/>
  <circle cx="600" cy="300" r="100" fill="#c084fc" opacity="0.14" filter="url(#glow)" class="glow-orb"/>

  <!-- Background Dynamic Flow Lines & Chart Curves (Subtle) -->
  <path d="M 50 260 Q 250 180 450 240 T 850 200 T 1150 220" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3" class="flow-line"/>
  <path d="M 50 300 Q 300 240 600 280 T 1150 260" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.25" class="flow-line"/>

  <!-- Left Background Dynamic Widget (NPS Score Pill) -->
  <g class="floating-pill-1" transform="translate(60, 45)" filter="url(#dropShadow)">
    <rect width="180" height="54" rx="27" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="30" cy="27" r="14" fill="url(#greenPill)"/>
    <text x="30" y="32" text-anchor="middle" fill="#ffffff" font-size="14" class="text-title">★</text>
    <text x="56" y="26" fill="#94a3b8" font-size="11" class="text-sub">NPS RATING</text>
    <text x="56" y="44" fill="#34d399" font-size="16" class="text-title">+76 EXCELLENT</text>
  </g>

  <!-- Right Background Dynamic Widget (Live Responses) -->
  <g class="floating-pill-2" transform="translate(940, 50)" filter="url(#dropShadow)">
    <rect width="200" height="54" rx="27" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="30" cy="27" r="14" fill="url(#purplePill)"/>
    <text x="30" y="32" text-anchor="middle" fill="#ffffff" font-size="14" class="text-title">⚡</text>
    <text x="56" y="26" fill="#94a3b8" font-size="11" class="text-sub">CSAT SATISFACTION</text>
    <text x="56" y="44" fill="#a78bfa" font-size="16" class="text-title">98.4% POSITIVE</text>
  </g>

  <!-- Right-Bottom Background Pill (Open-Source / Privacy) -->
  <g class="floating-pill-3" transform="translate(930, 260)" filter="url(#dropShadow)">
    <rect width="210" height="48" rx="24" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="26" cy="24" r="10" fill="#10b981"/>
    <text x="48" y="22" fill="#94a3b8" font-size="10" class="text-sub">DATA SOVEREIGNTY</text>
    <text x="48" y="37" fill="#6ee7b7" font-size="13" class="text-title">100% SELF-HOSTED</text>
  </g>

  <!-- Left-Bottom Background Pill (CES Metric) -->
  <g class="floating-pill-3" transform="translate(70, 260)" filter="url(#dropShadow)">
    <rect width="180" height="48" rx="24" fill="url(#cardGrad1)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="26" cy="24" r="10" fill="#f59e0b"/>
    <text x="46" y="22" fill="#94a3b8" font-size="10" class="text-sub">CUSTOMER EFFORT</text>
    <text x="46" y="37" fill="#fbbf24" font-size="13" class="text-title">CES 1.2 LOW EFFORT</text>
  </g>

  <!-- MAIN FOREGROUND CONTENT (Firmly in front, highly legible) -->
  <g filter="url(#dropShadow)">
    <!-- Small Category Pill Tag -->
    <rect x="440" y="52" width="320" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="456" cy="68" r="5" fill="#38bdf8"/>
    <text x="472" y="73" fill="#cbd5e1" font-size="12" class="text-badge" letter-spacing="1">AWESOME ECOSYSTEM INDEX</text>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" fill="#ffffff" font-size="44" class="text-title" letter-spacing="-0.5">
      Customer Feedback &amp; Surveys
    </text>

    <!-- Gradient Accent Sub-bar -->
    <rect x="420" y="162" width="360" height="4" rx="2" fill="url(#primaryGrad)"/>

    <!-- Subtitle -->
    <text x="600" y="202" text-anchor="middle" fill="#94a3b8" font-size="17" class="text-sub" letter-spacing="0.2">
      Curated Directory of Enterprise CX Platforms &amp; Open-Source Survey Engines
    </text>

    <!-- Tech Badges Bar (Foreground) -->
    <g transform="translate(290, 225)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="95" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="47" y="18" text-anchor="middle" fill="#38bdf8" font-size="11" class="text-badge">NPS &amp; CSAT</text>

      <!-- Badge 2 -->
      <rect x="105" y="0" width="115" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="162" y="18" text-anchor="middle" fill="#818cf8" font-size="11" class="text-badge">VoC ANALYTICS</text>

      <!-- Badge 3 -->
      <rect x="230" y="0" width="125" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="292" y="18" text-anchor="middle" fill="#a78bfa" font-size="11" class="text-badge">SAAS DIRECTORY</text>

      <!-- Badge 4 -->
      <rect x="365" y="0" width="135" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="432" y="18" text-anchor="middle" fill="#34d399" font-size="11" class="text-badge">OPEN SOURCE (MIT/AGPL)</text>

      <!-- Badge 5 -->
      <rect x="510" y="0" width="110" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="565" y="18" text-anchor="middle" fill="#f472b6" font-size="11" class="text-badge">DATA PRIVACY</text>
    </g>
  </g>
</svg>
